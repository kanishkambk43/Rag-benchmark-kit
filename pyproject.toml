[project]
name = "rag-benchmark-kit"
version = "0.1.0"
description = "A lightweight toolkit for auditing and benchmarking RAG evaluation datasets."
readme = "README.md"
authors = [
    { name = "kanishkambk43", email = "kanishkambk43@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff.lint]
ignore = ["PYI025"]